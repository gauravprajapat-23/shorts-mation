name: Phase 10 governance certification
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'src/lib/render-pipeline.server.ts'
      - 'src/lib/youtube-publisher-v2.server.ts'
      - 'src/lib/tenant-governance.server.ts'
      - 'src/lib/r2-retention.server.ts'
      - 'supabase/migrations/**'
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shorts_phase10
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix worker ci
      - run: npm run certify:phase10
      - name: Real PostgreSQL weighted-fair queue certification
        env:
          RENDER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shorts_phase10
        run: npm --prefix worker run certify:tenant-fairness
